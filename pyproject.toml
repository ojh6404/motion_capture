[tool.ruff]
line-length = 110
target-version = "py39"
exclude = [
    "third_party/hamer",
    "third_party/WiLoR",
    "third_party/Hamba",
    "third_party/hand_object_detector",
    "third_party/4D-Humans",
    "third_party/Arbitrary-Hands-3D-Reconstruction",
    "test",
    ".eggs",
    ".git",
    ".ruff_cache",
    "__pypackages__",
    "build",
    "dist",
]


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "B", "C4", "SIM"]
